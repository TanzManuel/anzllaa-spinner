<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Spinner</title><style>*{box-sizing:border-box}body{margin:0;background:#08080c;color:#fff;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:950px;margin:auto}.box{background:#111118;border:1px solid #ffffff16;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 15px 35px #0008}h1{margin-top:0}input{width:100%;padding:13px;border-radius:12px;border:1px solid #ffffff20;background:#09090d;color:#fff;margin:7px 0}button{padding:12px 17px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}.danger{background:#ef4444;color:#fff}.green{background:#22c55e;color:#fff}.muted{color:#aaa}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.row input{margin:0;flex:1}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#ffffff08;border-radius:14px;padding:16px}.stat b{display:block;font-size:28px}.codes{max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#08080c;padding:14px;border-radius:12px;color:#ddd}.prize-row{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin:8px 0}.total{padding:12px;border-radius:12px;background:#ffffff08;margin:10px 0;font-weight:800}.ok{color:#4ade80}.bad{color:#f87171}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;z-index:9999;transition:.3s}.modal.show{opacity:1;visibility:visible}.modalbox{max-width:420px;width:100%;background:#171720;border-radius:22px;padding:25px;text-align:center;transform:translateY(50px) scale(.8);transition:.4s}.modal.show .modalbox{transform:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}.prize-row{grid-template-columns:1fr 100px auto}}</style></head><body><main class="wrap"><section class="box" id="loginBox"><h1>🔐 Admin Spinner</h1><p class="muted">Masukkan password admin.</p><input id="password" type="password" placeholder="Password admin"><button class="primary" id="login">MASUK</button><p id="loginMsg"></p></section><section class="box hidden" id="panel"><div class="row"><h1 style="flex:1">⚙️ Panel Admin</h1><button class="green" id="refresh">🔄 REFRESH</button><button class="danger" id="logout">KELUAR</button></div><div class="grid"><div class="stat">Kode tersedia<b id="available">0</b></div><div class="stat">Kode terpakai<b id="used">0</b></div><div class="stat">Riwayat<b id="historyCount">0</b></div></div><h2>🎁 Pengaturan Hadiah</h2><div id="prizes"></div><div class="total" id="total">Total: 0%</div><div class="row"><button class="primary" id="addPrize">➕ TAMBAH HADIAH</button><button class="green" id="savePrizes">💾 SIMPAN</button><button class="danger" id="resetPrizes">♻️ RESET DEFAULT</button></div><p id="prizeMsg"></p><h2>🎟️ Generate Kode</h2><div class="row"><input id="amount" type="number" min="1" max="500" value="10"><button class="primary" id="generate">GENERATE</button></div><p id="genMsg"></p><div class="codes" id="newCodes">Belum ada kode baru.</div><h2>📋 Kode Tersedia</h2><div class="codes" id="availableList">Memuat...</div><h2>📜 Riwayat Spin</h2><div class="codes" id="historyList">Memuat...</div><p id="panelMsg"></p></section></main><div class="modal" id="modal"><div class="modalbox"><h2>⚠️ Reset Hadiah?</h2><p>Daftar hadiah akan dikembalikan ke default.</p><div class="row"><button id="cancel" class="primary">BATAL</button><button id="confirm" class="danger">RESET</button></div></div></div><script>const $=id=>document.getElementById(id);let prizeData=[];async function api(u,o={}){let r=await fetch(u,{...o,credentials:'same-origin'}),d;try{d=await r.json()}catch{throw Error('Respons server tidak valid.')}if(!r.ok)throw Error(d.error||'Request gagal');return d}function updateTotal(){let t=prizeData.reduce((a,p)=>a+Number(p.weight||0),0);$('total').textContent='Total: '+t.toFixed(2)+'%';$('total').className='total '+(Math.abs(t-100)<.001?'ok':'bad')}function renderPrizes(){let b=$('prizes');b.innerHTML='';prizeData.forEach((p,i)=>{let r=document.createElement('div');r.className='prize-row';r.innerHTML='<input class="pn" value="'+String(p.name).replaceAll('&','&amp;').replaceAll('"','&quot;')+'"><input class="pw" type="number" min="0" step="0.01" value="'+p.weight+'"><button class="danger" data-i="'+i+'">🗑️</button>';r.querySelector('button').onclick=()=>{prizeData.splice(i,1);renderPrizes()};b.appendChild(r)});updateTotal()}function readPrizes(){prizeData=[...document.querySelectorAll('.prize-row')].map(r=>({name:r.querySelector('.pn').value.trim(),weight:Number(r.querySelector('.pw').value||0)}));updateTotal()}async function load(){try{let d=await api('/api/admin-data');$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');$('available').textContent=d.available?.length||0;$('used').textContent=d.used?.length||0;$('historyCount').textContent=d.history?.length||0;$('availableList').textContent=d.available?.length?d.available.join('\n'):'Tidak ada kode tersedia.';$('historyList').textContent=d.history?.length?d.history.map(x=>(x.time?new Date(x.time).toLocaleString('id-ID'):'-')+' | '+x.code+' | '+x.prize).join('\n'):'Belum ada riwayat spin.';let p=await api('/api/prizes');prizeData=p.prizes;renderPrizes()}catch(e){$('panelMsg').textContent='❌ '+e.message}}$('login').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});await load()}catch(e){$('loginMsg').textContent='❌ '+e.message}};$('addPrize').onclick=()=>{readPrizes();prizeData.push({name:'Hadiah Baru',weight:0});renderPrizes()};$('savePrizes').onclick=async()=>{readPrizes();try{let d=await api('/api/prizes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prizes:prizeData})});prizeData=d.prizes;renderPrizes();$('prizeMsg').textContent='✅ Pengaturan hadiah tersimpan.'}catch(e){$('prizeMsg').textContent='❌ '+e.message}};$('resetPrizes').onclick=()=>{$('modal').classList.add('show')};$('cancel').onclick=()=>{$('modal').classList.remove('show')};$('confirm').onclick=async()=>{try{let d=await api('/api/prizes',{method:'DELETE'});prizeData=d.prizes;renderPrizes();$('prizeMsg').textContent='✅ Hadiah dikembalikan ke default.'}catch(e){$('prizeMsg').textContent='❌ '+e.message}finally{$('modal').classList.remove('show')}};$('generate').onclick=async()=>{try{let d=await api('/api/generate-codes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Number($('amount').value)})});$('newCodes').textContent=d.codes.join('\n');$('genMsg').textContent='✅ '+d.count+' kode berhasil dibuat.';await load()}catch(e){$('genMsg').textContent='❌ '+e.message}};$('refresh').onclick=load;$('logout').onclick=async()=>{try{await api('/api/logout',{method:'POST'})}finally{location.reload()}};load();</script></body></html>
