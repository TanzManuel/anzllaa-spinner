<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Spinner</title><style>*{box-sizing:border-box}body{margin:0;background:#08080c;color:#fff;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto}.box{background:#111118;border:1px solid #ffffff16;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 15px 35px #0008}h1{margin-top:0}input{width:100%;padding:14px;border-radius:12px;border:1px solid #ffffff20;background:#09090d;color:#fff;margin:8px 0}button{padding:12px 18px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}.danger{background:#ef4444;color:#fff}.muted{color:#aaa}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#ffffff08;border-radius:14px;padding:16px}.stat b{display:block;font-size:28px}.codes{max-height:350px;overflow:auto;white-space:pre-wrap;word-break:break-all;background:#08080c;padding:14px;border-radius:12px;color:#ddd}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.row input{margin:0;flex:1}@media(max-width:600px){.grid{grid-template-columns:1fr}.row{flex-direction:column;align-items:stretch}}</style></head><body><main class="wrap"><section class="box" id="loginBox"><h1>🔐 Admin Spinner</h1><p class="muted">Masukkan password admin.</p><input id="password" type="password" placeholder="Password admin"><button class="primary" id="login">MASUK</button><p id="loginMsg"></p></section><section class="box hidden" id="panel"><div class="row"><h1 style="flex:1">⚙️ Panel Admin</h1><button class="danger" id="logout">KELUAR</button></div><div class="grid"><div class="stat">Kode tersedia<b id="available">0</b></div><div class="stat">Kode terpakai<b id="used">0</b></div><div class="stat">Riwayat<b id="historyCount">0</b></div></div><h2>🎟️ Generate Kode</h2><div class="row"><input id="amount" type="number" min="1" max="500" value="10"><button class="primary" id="generate">GENERATE</button></div><p id="genMsg"></p><div class="codes" id="newCodes">Belum ada kode baru.</div><h2>📋 Kode Tersedia</h2><div class="codes" id="availableList"></div><h2>📜 Riwayat Spin</h2><div class="codes" id="historyList"></div></section></main><script>const $=id=>document.getElementById(id);async function api(u,o={}){let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request gagal');return d}async function load(){try{let d=await api('/api/admin-data');$('loginBox').classList.add('hidden');$('panel').classList.remove('hidden');$('available').textContent=d.available.length;$('used').textContent=d.used.length;$('historyCount').textContent=d.history.length;$('availableList').textContent=d.available.length?d.available.join('\n'):'Tidak ada kode tersedia.';$('historyList').textContent=d.history.length?d.history.map(x=>x.time+' | '+x.code+' | '+x.prize).join('\n'):'Belum ada riwayat.'}catch(e){$('loginMsg').textContent=e.message}}$('login').onclick=async()=>{try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});await load()}catch(e){$('loginMsg').textContent='❌ '+e.message}};$('generate').onclick=async()=>{try{let d=await api('/api/generate-codes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Number($('amount').value)})});$('newCodes').textContent=d.codes.join('\n');$('genMsg').textContent='✅ '+d.count+' kode berhasil dibuat.';await load()}catch(e){$('genMsg').textContent='❌ '+e.message}};$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};load();</script></body></html>
