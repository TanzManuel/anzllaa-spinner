<style>.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;z-index:9999;transition:opacity .3s ease,visibility .3s ease}.modal.show{opacity:1;visibility:visible}.modal-box{width:min(420px,100%);background:linear-gradient(145deg,#191922,#0e0e14);border:1px solid #ffffff20;border-radius:26px;padding:28px;text-align:center;box-shadow:0 25px 90px #000c,0 0 35px #ef444422;transform:translateY(70px) scale(.75);opacity:0;transition:transform .45s cubic-bezier(.16,1.3,.3,1),opacity .3s ease}.modal.show .modal-box{transform:translateY(0) scale(1);opacity:1}.modal.hide .modal-box{transform:translateY(50px) scale(.75);opacity:0}.modal-icon{width:82px;height:82px;margin:0 auto 15px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ef44441a;border:2px solid #ef444466;font-size:43px}.modal.show .modal-icon{animation:warningPop .65s ease,warningGlow 1.5s ease .55s infinite}.modal-box h2{margin:0 0 12px;font-size:23px}.modal-box p{color:#aaa;line-height:1.55;margin:0 0 24px}.modal-actions{display:flex;gap:10px}.modal-actions button{flex:1;border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.modal-cancel{background:#27272f;color:#fff}.modal-confirm{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}@keyframes warningPop{0%{transform:scale(.3) rotate(-20deg);opacity:0}55%{transform:scale(1.18) rotate(8deg);opacity:1}75%{transform:scale(.92) rotate(-4deg)}100%{transform:scale(1) rotate(0)}}@keyframes warningGlow{0%,100%{box-shadow:0 0 0 0 #ef444400}50%{box-shadow:0 0 0 13px #ef44441c}}</style><div class="modal" id="deleteModal"><div class="modal-box"><div class="modal-icon">⚠️</div><h2>Hapus Kode?</h2><p>Kode yang dipilih akan dinonaktifkan dan tidak dapat digunakan lagi.</p><div class="modal-actions"><button class="modal-cancel" id="cancelDelete">BATAL</button><button class="modal-confirm" id="confirmDelete">🗑️ HAPUS</button></div></div></div><script>const deleteModal=document.getElementById('deleteModal');function openDeletePopup(){deleteModal.classList.remove('hide');deleteModal.classList.add('show')}function closeDeletePopup(){deleteModal.classList.add('hide');setTimeout(()=>deleteModal.classList.remove('show','hide'),450)}document.getElementById('cancelDelete').onclick=closeDeletePopup;deleteModal.onclick=e=>{if(e.target===deleteModal)closeDeletePopup()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&deleteModal.classList.contains('show'))closeDeletePopup()});</script>
