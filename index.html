<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spinner Hadiah</title><style>*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:#0b1420 var(--bg-image) center/cover fixed no-repeat;display:flex;justify-content:center;padding:22px 14px;position:relative}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#07111dcc,#07111d99);z-index:-1}.wrap{width:min(520px,100%);text-align:center}.brand{font-size:30px;font-weight:900;margin:8px;text-shadow:0 3px 18px #0008}.brand span{color:#facc15}.sub{color:#eef9ff;margin-bottom:18px;text-shadow:0 2px 10px #0008}.card{background:#dff6ff2b;border:1px solid #ffffff55;box-shadow:0 18px 50px #0008,0 0 25px #8bdcff25;backdrop-filter:blur(16px);border-radius:24px;padding:18px}.code{width:100%;border:1px solid #ffffff70;background:#ffffff25;color:#fff;padding:15px;border-radius:14px;text-align:center;font-size:16px;outline:0;margin-bottom:10px;box-shadow:inset 0 1px 0 #fff5}.code::placeholder{color:#e8f8ff}.code:focus{border-color:#8bdcff;box-shadow:0 0 0 3px #8bdcff30}.button{border:0;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer}.check{width:100%;background:linear-gradient(135deg,#45b9df,#72cde8);color:#063044;box-shadow:0 8px 22px #0005}.status{min-height:24px;margin-top:12px;font-weight:700;text-shadow:0 2px 8px #0008}.wheelbox{position:relative;width:min(360px,90vw);aspect-ratio:1;margin:25px auto}.pointer{position:absolute;z-index:5;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #facc15;filter:drop-shadow(0 3px 8px #000)}#wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 0 22px #fff8,0 18px 40px #0008;transform:rotate(0deg);will-change:transform}.spin{border:0;background:linear-gradient(135deg,#facc15,#f59e0b);color:#fff;font-size:19px;padding:16px 42px;border-radius:50px;box-shadow:0 10px 25px #0008;cursor:pointer;font-weight:900}.spin:disabled{opacity:.45}.result{display:none;margin-top:18px;padding:20px;border-radius:18px;background:#dff6ff35;border:1px solid #ffffff45;box-shadow:0 0 35px #facc1550;animation:resultIn .7s cubic-bezier(.16,1.3,.3,1)}.result h2{margin:0 0 8px;color:#facc15}.prize{font-size:31px;font-weight:900;color:#fff;text-shadow:0 0 20px #facc15}.small{font-size:12px;color:#e4f5fb;margin-top:18px;text-shadow:0 2px 8px #0008}@keyframes resultIn{0%{opacity:0;transform:translateY(25px) scale(.7)}60%{transform:translateY(-5px) scale(1.04)}100%{opacity:1;transform:translateY(0) scale(1)}}.celebrate{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}.particle{position:absolute;top:-30px;animation:fall 2.8s linear forwards;text-shadow:0 2px 8px #0008}@keyframes fall{0%{transform:translateY(-30px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}</style></head><body style="--bg-image:radial-gradient(circle at 50% 10%,#3b1b75,#140b2c 42%,#07050e)"><div class="celebrate" id="celebrate"></div><main class="wrap"><div class="brand">🎡 SPINNER <span>HADIAH</span></div><div class="sub">Masukkan kode redeem untuk mendapatkan kesempatan spin</div><section class="card"><input class="code" id="code" placeholder="SPIN-XXXXXXXX" autocomplete="off" maxlength="13"><button class="button check" id="check">🔑 CEK KODE</button><div class="status" id="status"></div></section><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="360" height="360"></canvas></div><button class="spin" id="spin" disabled>🎯 SPIN SEKARANG</button><section class="result" id="result"><h2>🎉 SELAMAT!</h2><div class="prize" id="prize"></div><div class="small">Kode ini sudah digunakan dan tidak dapat dipakai kembali.</div></section><div class="small">Admin : <b>Anzllaa</b></div></main><script>let prizes=['Rp10.000','Rp20.000','Rp50.000','Voucher','Pulsa 10K','Coba Lagi','Rp100.000','Hadiah Spesial'],canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),codeEl=document.getElementById('code'),statusEl=document.getElementById('status'),spinBtn=document.getElementById('spin'),checkBtn=document.getElementById('check'),result=document.getElementById('result'),prizeEl=document.getElementById('prize'),celebrate=document.getElementById('celebrate');let currentCode='',rotation=0,busy=false;function draw(){let c=180,r=170,s=Math.PI*2/prizes.length;ctx.clearRect(0,0,360,360);for(let i=0;i<prizes.length;i++){let a=i*s;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+s);ctx.closePath();ctx.fillStyle=i%2?'#facc15':'#ef4444';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(a+s/2);ctx.fillStyle=i%2?'#111827':'#fff';ctx.font='900 13px Arial';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(prizes[i],r-13,0);ctx.restore()}ctx.beginPath();ctx.arc(c,c,27,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}async function loadPrizes(){try{let r=await fetch('/api/prizes',{cache:'no-store'}),d=await r.json();if(d.ok&&Array.isArray(d.prizes)&&d.prizes.length){prizes=d.prizes.map(x=>x.name);draw()}}catch(e){}}function msg(t,c){statusEl.textContent=t;statusEl.style.color=c}function celebration(){celebrate.innerHTML='';let icons=['🎉','✨','🎊','⭐','💰','🎁','❄️','🩵'];for(let i=0;i<45;i++){let p=document.createElement('div');p.className='particle';p.textContent=icons[Math.floor(Math.random()*icons.length)];p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*.8+'s';p.style.fontSize=14+Math.random()*18+'px';celebrate.appendChild(p)}setTimeout(()=>celebrate.innerHTML='',4000)}async function spinWheel(){if(busy||!currentCode)return;busy=true;spinBtn.disabled=true;checkBtn.disabled=true;codeEl.disabled=true;result.style.display='none';msg('🎡 Roda sedang berputar...','#facc15');let startRotation=rotation,last=performance.now(),speed=0,targetSpeed=0.72,data=null,error=null,start=performance.now(),minRun=2200,done=false;const request=fetch('/api/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:currentCode})}).then(r=>r.json()).then(d=>{if(!d.ok)throw Error(d.error||'Spin gagal');data=d}).catch(e=>error=e);function frame(now){let dt=Math.min(40,now-last);last=now;if(!done){speed+=((targetSpeed-speed)*Math.min(1,dt/350));rotation+=speed*dt;canvas.style.transform='rotate('+rotation+'deg)';if(data||error){if(error){done=true;msg('❌ '+error.message,'#f87171');spinBtn.disabled=false;checkBtn.disabled=false;codeEl.disabled=false;busy=false;return}if(now-start>=minRun){done=true;finishSpin(now)}}}if(!done)requestAnimationFrame(frame)}function finishSpin(now){let slice=360/prizes.length,winnerCenter=data.winnerIndex*slice+slice/2,pointerAngle=270,current=((rotation%360)+360)%360,target=((pointerAngle-winnerCenter)%360+360)%360,correction=(target-current+360)%360,total=360*4+correction,from=rotation,to=rotation+total,duration=3000,t0=now;function ease(t){return 1-Math.pow(1-t,3)}function stopFrame(tn){let p=Math.min(1,(tn-t0)/duration),v=from+(to-from)*ease(p);rotation=v;canvas.style.transform='rotate('+v+'deg)';if(p<1)requestAnimationFrame(stopFrame);else{rotation=to;canvas.style.transform='rotate('+to+'deg)';prizeEl.textContent=data.prize;result.style.display='block';msg('🎉 Selamat! Hadiah kamu: '+data.prize,'#facc15');celebration();busy=false;checkBtn.disabled=false;codeEl.disabled=false}}requestAnimationFrame(stopFrame)}requestAnimationFrame(frame);await request}checkBtn.onclick=async()=>{if(busy)return;let code=codeEl.value.trim().toUpperCase();if(!code)return msg('⚠️ Masukkan kode terlebih dahulu.','#facc15');checkBtn.disabled=true;try{let r=await fetch('/api/check-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}),d=await r.json();if(d.valid){currentCode=code;spinBtn.disabled=false;msg('✅ Kode valid! Kamu bisa spin.','#4ade80')}else{currentCode='';spinBtn.disabled=true;msg('❌ '+(d.error||'Kode tidak valid.'),'#f87171')}}catch(e){msg('❌ Gagal terhubung ke server.','#f87171')}finally{checkBtn.disabled=false}};spinBtn.onclick=spinWheel;loadPrizes();draw();</script></body></html>
