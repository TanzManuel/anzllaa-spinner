<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spinner Hadiah</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:#fff;background:radial-gradient(circle at 50% 10%,#b9e8f7,#eaf8fc 42%,#d7f0f6);display:flex;justify-content:center;padding:22px 14px}.wrap{width:min(520px,100%);text-align:center}.brand{font-size:30px;font-weight:900;margin:8px}.brand span{color:#63bddb}.sub{color:#d5eaf0;margin-bottom:18px}.card{background:#ffffff0d;border:1px solid #9fe7ff30;box-shadow:0 18px 50px #0008;backdrop-filter:blur(14px);border-radius:24px;padding:18px}input{width:100%;border:1px solid #ffffff22;background:#fff0;color:#fff;padding:15px;border-radius:14px;text-align:center;font-size:16px;outline:0;margin-bottom:10px}button{border:0;border-radius:14px;padding:14px 20px;font-weight:800;cursor:pointer}.check{width:100%;background:linear-gradient(135deg,#72c7e6,#8bd3ea);color:#fff}.status{min-height:24px;margin-top:12px}.wheelbox{position:relative;width:min(360px,90vw);aspect-ratio:1;margin:25px auto}.pointer{position:absolute;z-index:5;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:18px solid transparent;border-right:18px solid transparent;border-top:38px solid #63bddb;filter:drop-shadow(0 3px 8px #000)}#wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 0 22px #fff8,0 18px 40px #0008;transform:rotate(0deg);will-change:transform}.spin{background:linear-gradient(135deg,#63bddb,#78cce3);color:#fff;font-size:19px;padding:16px 42px;border-radius:50px;box-shadow:0 10px 25px #0008}.spin:disabled{opacity:.45}.result{display:none;margin-top:18px;padding:18px;border-radius:18px;background:#ffffff12}.result h2{margin:0 0 8px;color:#63bddb}.prize{font-size:31px;font-weight:900}.small{font-size:12px;color:#a9c8d1;margin-top:18px}</style></head><body><main class="wrap"><div class="brand">🎡 SPINNER <span>HADIAH</span></div><div class="sub">Masukkan kode redeem untuk mendapatkan kesempatan spin</div><section class="card"><input id="code" placeholder="SPIN-XXXXXXXX" autocomplete="off" maxlength="13"><button class="check" id="check">🔑 CEK KODE</button><div class="status" id="status"></div></section><div class="wheelbox"><div class="pointer"></div><canvas id="wheel" width="360" height="360"></canvas></div><button class="spin" id="spin" disabled>🎯 SPIN SEKARANG</button><section class="result" id="result"><h2>🎉 SELAMAT!</h2><div class="prize" id="prize"></div><div class="small">Kode ini sudah digunakan dan tidak dapat dipakai kembali.</div></section><div class="small">Admin: <b>/admin.html</b></div></main><script>let prizes=['Rp10.000','Rp20.000','Rp50.000','Voucher','Pulsa 10K','Coba Lagi','Rp100.000','Hadiah Spesial'],canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),codeEl=document.getElementById('code'),statusEl=document.getElementById('status'),spinBtn=document.getElementById('spin'),checkBtn=document.getElementById('check'),result=document.getElementById('result'),prizeEl=document.getElementById('prize');let currentCode='',rotation=0,busy=false;function draw(){let c=180,r=170,s=Math.PI*2/prizes.length;ctx.clearRect(0,0,360,360);for(let i=0;i<prizes.length;i++){let a=i*s;ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+s);ctx.closePath();ctx.fillStyle=i%2?'#63bddb':'#6fc5df';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.translate(c,c);ctx.rotate(a+s/2);ctx.fillStyle=i%2?'#183b4a':'#fff';ctx.font='900 13px Arial';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(prizes[i],r-13,0);ctx.restore()}ctx.beginPath();ctx.arc(c,c,27,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}async function loadPrizes(){try{let r=await fetch('/api/prizes');let d=await r.json();if(d.ok&&Array.isArray(d.prizes)&&d.prizes.length){prizes=d.prizes.map(x=>x.name);draw()}}catch(e){}}loadPrizes();draw();const msg=(t,c)=>{statusEl.textContent=t;statusEl.style.color=c};checkBtn.onclick=async()=>{if(busy)return;let code=codeEl.value.trim().toUpperCase();if(!code)return msg('⚠️ Masukkan kode terlebih dahulu.','#63bddb');checkBtn.disabled=true;try{let r=await fetch('/api/check-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})}),d=await r.json();if(d.valid){currentCode=code;spinBtn.disabled=false;msg('✅ Kode valid! Kamu bisa spin.','#50c9a8')}else{currentCode='';spinBtn.disabled=true;msg('❌ '+d.error,'#e58b9b')}}catch(e){msg('❌ Gagal terhubung ke server.','#e58b9b')}finally{checkBtn.disabled=false}};spinBtn.onclick=async()=>{if(busy||!currentCode)return;busy=true;spinBtn.disabled=true;checkBtn.disabled=true;codeEl.disabled=true;result.style.display='none';msg('🎡 Roda sedang berputar...','#63bddb');let start=performance.now(),startRotation=rotation,serverDone=false,data=null,failed=null,fastSpin=360*8;rotation=startRotation+fastSpin;let duration=3200;canvas.animate([{transform:'rotate('+startRotation+'deg)'},{transform:'rotate('+rotation+'deg)'}],{duration:duration,easing:'cubic-bezier(.12,.8,.16,1)',fill:'forwards'});try{let r=await fetch('/api/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:currentCode})});data=await r.json();serverDone=true;if(!data.ok)throw Error(data.error);let slice=360/prizes.length,winnerCenter=data.winnerIndex*slice+slice/2,pointerAngle=270,base=rotation,target=pointerAngle-winnerCenter,current=((base%360)+360)%360,correction=((target-current)%360+360)%360,finalRotation=base+correction+360*2,remaining=Math.max(900,duration-(performance.now()-start));let anim=canvas.animate([{transform:'rotate('+base+'deg)'},{transform:'rotate('+finalRotation+'deg)'}],{duration:remaining,easing:'cubic-bezier(.12,.8,.16,1)',fill:'forwards'});rotation=finalRotation;anim.onfinish=()=>{prizeEl.textContent=data.prize;result.style.display='block';msg('🎉 Selamat! Hadiah kamu: '+data.prize,'#63bddb');busy=false;checkBtn.disabled=false;codeEl.disabled=false}}catch(e){failed=e;if(!serverDone){msg('❌ Gagal terhubung ke server.','#e58b9b')}else{msg('❌ '+e.message,'#e58b9b')}spinBtn.disabled=false;checkBtn.disabled=false;codeEl.disabled=false;busy=false}};</script></body></html>
